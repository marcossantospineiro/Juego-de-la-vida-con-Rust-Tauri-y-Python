<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<link rel="stylesheet" href="../styles.css"/>
	<title>Juego de la vida</title>
</head>
<body onload="createGrid(factor)">
	<style>

		body {
			display: flex;
		}

	</style>

	<div id="menu">
		<h2><button type="submit" onclick="sendPositions()">Enviar</button></h2>
	</div>
	<div id="grid">
	</div>

	<script>
		const { invoke } = window.__TAURI__.core;
		const factor = 10;

		function createGrid(number) {
			
			inputs = "";

			for (let i = 0; i < number**2; i++) {
				inputs += `
					<input type="checkbox">
				`;
			}
			
			document.getElementById("grid").innerHTML = inputs;
		}

		function createCoordinates(number, size) {
			return [Math.floor(number / size), number % size]; // Muy elegante
		}

		function getMarked() {

			const all = document.querySelectorAll('#grid input[type="checkbox"]');
			const index_vector = Array.from(all).map((checkbox, index) => checkbox.checked ? index : null).filter(index => index !== null);

			let positions = [];

			for (let i = 0; i < index_vector.length; i++) {
				positions[i] = createCoordinates(index_vector[i], factor);
			}

			console.log("Posiciones en el grid:", positions);
			return positions;
	
		};

		async function sendPositions() {
			await invoke("sendPositions", { positions: getMarked()});
		}

	</script>
</body>
</html>
